config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/curl/curl:
      branch: master
      repo: https://github.com/curl/curl
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/curl/curl git:
        commands:
        - /usr/bin/env sh .sqa/script.squeaky-cobalt-indri.sh
        container: qc.acc_stuffy-dandelion-seahorse
  QC.Doc:
    repos:
      github.com/curl/curl find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.chummy-pumpkin-wombat.sh
        container: qc.doc_dorky-mauve-wolf
      github.com/curl/curl git:
        commands:
        - /usr/bin/env sh .sqa/script.dorky-aquamarine-fly.sh
        container: qc.doc_frumpy-denim-tarsier
      github.com/curl/curl markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.goopy-white-koala.sh
        container: qc.doc_slimy-jade-salamander
  QC.Lic:
    repos:
      github.com/curl/curl licensee:
        commands:
        - /usr/bin/env sh .sqa/script.flabby-lime-forest.sh
        container: qc.lic_baggy-sapphire-chamois
  QC.Sec:
    repos:
      github.com/curl/curl bandit:
        commands:
        - /usr/bin/env sh .sqa/script.boozy-chestnut-turtle.sh
        container: qc.sec_gloppy-white-boar
  QC.Sty:
    repos:
      github.com/curl/curl flake8:
        commands:
        - /usr/bin/env sh .sqa/script.lousy-ecru-liger.sh
        container: qc.sty_squeaky-cyan-akita
      github.com/curl/curl hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.freaky-tan-turkey.sh
        container: qc.sty_ugly-tangerine-salamander
      github.com/curl/curl jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.silly-orange-axolotl.sh
        container: qc.sty_slaphappy-zucchini-vole
      github.com/curl/curl oclint:
        commands:
        - /usr/bin/env sh .sqa/script.surly-copper-alligator.sh
        container: qc.sty_hilly-asparagus-ferret
  QC.Uni:
    repos:
      github.com/curl/curl pytest:
        commands:
        - /usr/bin/env sh .sqa/script.shabby-lime-worm.sh
        container: qc.uni_stinky-bistre-olm
  QC.Ver:
    repos:
      github.com/curl/curl get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.scanty-crimson-indri.sh
        container: qc.ver_scanty-olivine-dodo
timeout: 5400
